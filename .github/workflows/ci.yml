
name: Employee Portal CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Employee Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Check required project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present!"

      - name: Validate HTML title
        run: grep -qi "<title>" index.html

      - name: Validation success message
        run: echo "All validations passed!"

  deploy:
    name: Deploy Employee Portal
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Display deployment environment
        run: echo "Deploying to ${{ vars.APP_ENV }}"

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
